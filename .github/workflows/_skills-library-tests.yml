name: _skills-library-tests

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label
        type: string
        default: ubuntu-24.04

permissions: {}

jobs:
  test:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install-Module Pester -RequiredVersion 5.7.1
        shell: pwsh
        run: Install-Module Pester -Scope CurrentUser -RequiredVersion 5.7.1 -Force

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: verify local fixture tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion -lt [version]'7.4') { throw 'PowerShell 7.4 or later is required.' }
          foreach ($tool in 'git', 'bash', 'helm', 'yq', 'node', 'npm') {
            Get-Command $tool -ErrorAction Stop | Select-Object Name, Source
          }
          helm version --short
          if ($LASTEXITCODE -ne 0) { throw 'Helm is unavailable.' }
          $yqVersion = yq --version
          if ($LASTEXITCODE -ne 0 -or "$yqVersion" -notmatch 'mikefarah/yq.*version v4\.') {
            throw 'The fixture suite requires Mike Farah yq v4.'
          }
          Write-Host $yqVersion

      - name: npm run test:ps
        run: npm run test:ps

  #The Python and Bash variants of the skill bootstrap helper; maintainer tooling stays PowerShell-only.
  python-helper:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      #setup-uv publishes no floating major tag, so the full release is pinned.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: 0.13.6

      - name: uv sync --group test --locked
        run: uv sync --group test --locked

      - name: uv run ruff format --check
        run: uv run --no-sync ruff format --check

      - name: uv run ruff check
        run: uv run --no-sync ruff check

      - name: uv run mypy
        run: uv run --no-sync mypy

      - name: uv run pytest
        run: uv run --no-sync pytest

  bash-helper:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck src/skill-library-extension/scripts/bash/skill-library.sh .github/skills/skill-library/scripts/tests/fixtures/helper/specify
          shellcheck -s bash .github/skills/skill-library/scripts/tests/bash/skill-library.bats

      #bats-action publishes no floating major tag, so the full release is pinned.
      - id: setup-bats
        uses: bats-core/bats-action@4.1.0
        with:
          detik-install: false
          file-install: false

      - name: bats .github/skills/skill-library/scripts/tests/bash
        env:
          BATS_LIB_PATH: ${{ steps.setup-bats.outputs.lib-path }}
          TERM: xterm
        run: bats .github/skills/skill-library/scripts/tests/bash
