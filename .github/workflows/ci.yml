name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    uses: f2calv/gha-workflows/.github/workflows/lint.yml@v1
    permissions:
      contents: read

  versioning:
    uses: f2calv/gha-workflows/.github/workflows/gha-release-versioning.yml@v1
    with:
      tag-and-release: false
      tag-prefix: ''
      move-major-tag: false
    permissions:
      contents: read

  skills-library-tests:
    uses: ./.github/workflows/_skills-library-tests.yml
    permissions:
      contents: read

  test:
    if: always()
    needs: [skills-library-tests]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: verify required test result
        shell: pwsh
        env:
          TEST_RESULT: ${{ needs.skills-library-tests.result }}
        run: |
          if ($env:TEST_RESULT -ne 'success') {
            throw "Skills-library tests did not succeed: $env:TEST_RESULT"
          }

  dotnet-examples:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .github/skills/dotnet-performance/examples/utf8-count
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: dotnet build Example.CountParsing.slnx --configuration Release
        run: dotnet build Example.CountParsing.slnx --configuration Release

      - name: dotnet test parsing example
        run: >-
          dotnet test --project src/Example.CountParsing.Tests/Example.CountParsing.Tests.csproj
          --configuration Release --no-build --filter-trait "Category=Parsing"
          --minimum-expected-tests 16

  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [lint, versioning, test, dotnet-examples]
    uses: f2calv/gha-workflows/.github/workflows/gha-release-versioning.yml@v1
    with:
      semVer: ${{ needs.versioning.outputs.version }}
      tag-prefix: ''
      move-major-tag: false
    permissions:
      contents: write
