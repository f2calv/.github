name: ci

'on':
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  lint:
    uses: f2calv/gha-workflows/.github/workflows/lint.yml@v1
    permissions:
      contents: read

  versioning:
    uses: f2calv/gha-workflows/.github/workflows/gha-release-versioning.yml@v1
    with:
      tag-and-release: false
      tag-prefix: ''
      move-major-tag: false
    permissions:
      contents: read

  docs:
    uses: f2calv/gha-workflows/.github/workflows/mkdocs-build.yml@v1
    with:
      prepare-script: .scripts/Prepare-Documentation.ps1
      site-directory: .docs-site
    permissions:
      contents: read

  pages-preview:
    if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [docs, skill-versions]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: build read-only released catalog
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./.github/skills/skill-library/scripts/Publish-SkillRelease.ps1
          -CatalogOnly -OutputDirectory .catalog-preview -SiteDirectory .pages-preview

      - uses: actions/download-artifact@v7
        with:
          name: mkdocs-site
          path: .docs-site

      - name: assemble and verify complete Pages preview
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Before = Get-FileHash .pages-preview/catalog.json, .pages-preview/index.html
          if (Test-Path .pages-preview/docs) { throw 'Documentation output collides with the catalog site.' }
          Copy-Item -LiteralPath .docs-site -Destination .pages-preview/docs -Recurse
          foreach ($Item in $Before) {
            if ((Get-FileHash $Item.Path).Hash -ne $Item.Hash) { throw 'A protected catalog output changed.' }
          }
          foreach ($Path in 'catalog.json', 'index.html', 'docs/index.html', 'docs/search/search_index.json') {
            if (-not (Test-Path (Join-Path .pages-preview $Path) -PathType Leaf)) { throw 'Complete Pages preview is missing an expected output.' }
          }

      - uses: actions/upload-artifact@v6
        with:
          name: complete-pages-preview
          path: .pages-preview
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  skills-library-tests:
    uses: ./.github/workflows/_skills-library-tests.yml
    permissions:
      contents: read

  #The full suite needs Linux-only tooling; the skill-library tooling is also supported on Windows and macOS.
  skill-library-platforms:
    name: skill-library-platforms (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: install yq (${{ matrix.os }})
        shell: pwsh
        run: |
          if ($IsWindows) { choco install yq --no-progress -y }
          elseif (-not (Get-Command yq -ErrorAction SilentlyContinue)) { brew install yq }
          yq --version

      - name: Install-Module Pester -RequiredVersion 5.7.1
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: test skill-library (${{ matrix.os }})
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 5.7.1 -Force
          $Config = New-PesterConfiguration
          $Config.Run.Path = './.github/skills/skill-library/scripts/tests'
          $Config.Run.PassThru = $true
          $Config.Output.Verbosity = 'Detailed'
          $Result = Invoke-Pester -Configuration $Config
          if ($Result.FailedCount -or $Result.FailedContainersCount -or -not $Result.PassedCount) {
            throw "skill-library tests failed: $($Result.FailedCount) failed, $($Result.PassedCount) passed"
          }

  test:
    if: always()
    needs: [skills-library-tests, skill-library-platforms]
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: verify required test results
        shell: pwsh
        env:
          TEST_RESULT: ${{ needs.skills-library-tests.result }}
          PLATFORM_RESULT: ${{ needs.skill-library-platforms.result }}
        run: |
          if ($env:TEST_RESULT -ne 'success') {
            throw "Skills-library tests did not succeed: $env:TEST_RESULT"
          }
          if ($env:PLATFORM_RESULT -ne 'success') {
            throw "Skill-library platform tests did not succeed: $env:PLATFORM_RESULT"
          }

  dotnet-examples:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .github/skills/dotnet-performance/examples/utf8-count
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: dotnet build Example.CountParsing.slnx --configuration Release
        run: dotnet build Example.CountParsing.slnx --configuration Release

      - name: dotnet test parsing example
        run: >-
          dotnet test --project src/Example.CountParsing.Tests/Example.CountParsing.Tests.csproj
          --configuration Release --no-build --filter-trait "Category=Parsing"
          --minimum-expected-tests 16

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.403

      - name: dotnet build Example.HttpContract.slnx --configuration Release
        working-directory: .github/skills/dotnet-webapi/examples/http-contract
        run: dotnet build Example.HttpContract.slnx --configuration Release

      - name: dotnet test HTTP contract example
        working-directory: .github/skills/dotnet-webapi/examples/http-contract
        env:
          EXAMPLE_CONTROLLER_PATH: ${{ github.workspace }}/.github/skills/dotnet-webapi/examples/http-contract/src/Example.Controllers.SampleApp/bin/Release/net10.0/Example.Controllers.SampleApp.dll
          EXAMPLE_MINIMAL_PATH: ${{ github.workspace }}/.github/skills/dotnet-webapi/examples/http-contract/src/Example.Minimal.SampleApp/bin/Release/net10.0/Example.Minimal.SampleApp.dll
        run: >-
          dotnet test --project src/Example.HttpContract.Tests/Example.HttpContract.Tests.csproj
          --configuration Release --no-build
          --filter-class Example.HttpContract.Tests.Integration.HttpContractTests
          --minimum-expected-tests 19

  skill-versions:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test-SkillLibrary.ps1
        shell: pwsh
        run: ./.github/skills/skill-library/scripts/Test-SkillLibrary.ps1

  skill-releases:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [lint, test, skill-versions, docs]
    runs-on: ubuntu-26.04
    concurrency:
      group: skill-releases
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      site-directory: ${{ steps.publish.outputs.site-directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Publish-SkillRelease.ps1
        id: publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/skills/skill-library/scripts/Publish-SkillRelease.ps1 -RefreshCatalog

      - uses: actions/download-artifact@v7
        with:
          name: mkdocs-site
          path: .docs-site

      - name: assemble complete Pages site
        shell: pwsh
        env:
          SITE_DIRECTORY: ${{ steps.publish.outputs.site-directory }}
        run: |
          $ErrorActionPreference = 'Stop'
          $Before = Get-FileHash (Join-Path $env:SITE_DIRECTORY 'catalog.json'), (Join-Path $env:SITE_DIRECTORY 'index.html')
          $Destination = Join-Path $env:SITE_DIRECTORY 'docs'
          if (Test-Path $Destination) { throw 'Documentation output collides with the catalog site.' }
          Copy-Item -LiteralPath .docs-site -Destination $Destination -Recurse
          foreach ($Item in $Before) {
            if ((Get-FileHash $Item.Path).Hash -ne $Item.Hash) { throw 'A protected catalog output changed.' }
          }

      - uses: actions/upload-pages-artifact@v5
        if: steps.publish.outputs.site-directory != ''
        with:
          path: ${{ steps.publish.outputs.site-directory }}
          include-hidden-files: true

  skill-catalog:
    if: needs.skill-releases.outputs.site-directory != ''
    needs: [skill-releases]
    runs-on: ubuntu-26.04
    concurrency:
      group: skill-catalog
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deploy

  #The final fan-in: the repository tag moves only after skill releases and the catalog succeed.
  #The catalog is refreshed on every default-branch run, including documentation-only changes.
  release:
    if: >-
      always()
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && needs.lint.result == 'success'
      && needs.versioning.result == 'success'
      && needs.test.result == 'success'
      && needs.dotnet-examples.result == 'success'
      && needs.skill-versions.result == 'success'
      && needs.docs.result == 'success'
      && needs.skill-releases.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.skill-catalog.result)
    needs: [lint, versioning, test, dotnet-examples, skill-versions, docs, skill-releases, skill-catalog]
    uses: f2calv/gha-workflows/.github/workflows/gha-release-versioning.yml@v1
    with:
      semVer: ${{ needs.versioning.outputs.version }}
      tag-prefix: ''
      move-major-tag: false
    permissions:
      contents: write
