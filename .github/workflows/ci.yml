name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    uses: f2calv/gha-workflows/.github/workflows/lint.yml@v1
    permissions:
      contents: read

  versioning:
    uses: f2calv/gha-workflows/.github/workflows/gha-release-versioning.yml@v1
    with:
      tag-and-release: false
      tag-prefix: ''
      move-major-tag: false
    permissions:
      contents: read

  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install-Module Pester -RequiredVersion 5.7.1
        shell: pwsh
        run: Install-Module Pester -Scope CurrentUser -RequiredVersion 5.7.1 -Force

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: verify local fixture tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion -lt [version]'7.4') { throw 'PowerShell 7.4 or later is required.' }
          foreach ($tool in 'git', 'bash', 'helm', 'yq', 'node', 'npm') {
            Get-Command $tool -ErrorAction Stop | Select-Object Name, Source
          }
          helm version --short
          if ($LASTEXITCODE -ne 0) { throw 'Helm is unavailable.' }
          $yqVersion = yq --version
          if ($LASTEXITCODE -ne 0 -or "$yqVersion" -notmatch 'mikefarah/yq.*version v4\.') {
            throw 'The fixture suite requires Mike Farah yq v4.'
          }
          Write-Host $yqVersion

      - name: npm run test:ps
        run: npm run test:ps

  dotnet-examples:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .github/skills/dotnet-performance/examples/utf8-count
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: dotnet build Example.CountParsing.slnx --configuration Release
        run: dotnet build Example.CountParsing.slnx --configuration Release

      - name: dotnet test parsing example
        run: >-
          dotnet test --project src/Example.CountParsing.Tests/Example.CountParsing.Tests.csproj
          --configuration Release --no-build --filter-trait "Category=Parsing"
          --minimum-expected-tests 16

  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [lint, versioning, test, dotnet-examples]
    uses: f2calv/gha-workflows/.github/workflows/gha-release-versioning.yml@v1
    with:
      semVer: ${{ needs.versioning.outputs.version }}
      tag-prefix: ''
      move-major-tag: false
    permissions:
      contents: write
