name: ci

'on':
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    uses: f2calv/gha-workflows/.github/workflows/lint.yml@v1
    permissions:
      contents: read

  versioning:
    uses: f2calv/gha-workflows/.github/workflows/gha-release-versioning.yml@v1
    with:
      tag-and-release: false
      tag-prefix: ''
      move-major-tag: false
    permissions:
      contents: read

  skills-library-tests:
    uses: ./.github/workflows/_skills-library-tests.yml
    permissions:
      contents: read

  #The full suite needs Linux-only tooling; the skill-library tooling is also supported on Windows and macOS.
  skill-library-platforms:
    name: skill-library-platforms (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: install yq (${{ matrix.os }})
        shell: pwsh
        run: |
          if ($IsWindows) { choco install yq --no-progress -y }
          elseif (-not (Get-Command yq -ErrorAction SilentlyContinue)) { brew install yq }
          yq --version

      - name: Install-Module Pester -RequiredVersion 5.7.1
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: test skill-library (${{ matrix.os }})
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 5.7.1 -Force
          $Config = New-PesterConfiguration
          $Config.Run.Path = './.github/skills/skill-library/scripts/tests'
          $Config.Run.PassThru = $true
          $Config.Output.Verbosity = 'Detailed'
          $Result = Invoke-Pester -Configuration $Config
          if ($Result.FailedCount -or $Result.FailedContainersCount -or -not $Result.PassedCount) {
            throw "skill-library tests failed: $($Result.FailedCount) failed, $($Result.PassedCount) passed"
          }

  test:
    if: always()
    needs: [skills-library-tests, skill-library-platforms]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: verify required test results
        shell: pwsh
        env:
          TEST_RESULT: ${{ needs.skills-library-tests.result }}
          PLATFORM_RESULT: ${{ needs.skill-library-platforms.result }}
        run: |
          if ($env:TEST_RESULT -ne 'success') {
            throw "Skills-library tests did not succeed: $env:TEST_RESULT"
          }
          if ($env:PLATFORM_RESULT -ne 'success') {
            throw "Skill-library platform tests did not succeed: $env:PLATFORM_RESULT"
          }

  dotnet-examples:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .github/skills/dotnet-performance/examples/utf8-count
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: dotnet build Example.CountParsing.slnx --configuration Release
        run: dotnet build Example.CountParsing.slnx --configuration Release

      - name: dotnet test parsing example
        run: >-
          dotnet test --project src/Example.CountParsing.Tests/Example.CountParsing.Tests.csproj
          --configuration Release --no-build --filter-trait "Category=Parsing"
          --minimum-expected-tests 16

  skill-versions:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test-SkillLibrary.ps1
        shell: pwsh
        run: ./.github/skills/skill-library/scripts/Test-SkillLibrary.ps1

  skill-releases:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [lint, test, skill-versions]
    runs-on: ubuntu-24.04
    concurrency:
      group: skill-releases
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      site-directory: ${{ steps.publish.outputs.site-directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Publish-SkillRelease.ps1
        id: publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/skills/skill-library/scripts/Publish-SkillRelease.ps1

      - uses: actions/upload-pages-artifact@v4
        if: steps.publish.outputs.site-directory != ''
        with:
          path: ${{ steps.publish.outputs.site-directory }}

  skill-catalog:
    if: needs.skill-releases.outputs.site-directory != ''
    needs: [skill-releases]
    runs-on: ubuntu-24.04
    concurrency:
      group: skill-catalog
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy

  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [lint, versioning, test, dotnet-examples, skill-versions]
    uses: f2calv/gha-workflows/.github/workflows/gha-release-versioning.yml@v1
    with:
      semVer: ${{ needs.versioning.outputs.version }}
      tag-prefix: ''
      move-major-tag: false
    permissions:
      contents: write
