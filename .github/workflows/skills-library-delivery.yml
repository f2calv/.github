name: skills-library-delivery

'on':
  workflow_dispatch:
    inputs:
      mode:
        description: Preparation report or committed artifact build
        type: choice
        options: [prepare, build]
        default: prepare
      impact-json:
        description: Explicit component version impacts as JSON
        type: string
        default: '{}'
      bootstrap-ids:
        description: Unpublished component IDs as a JSON array
        type: string
        default: '[]'
      previous-delivery-run:
        description: Prior artifact run supplying unchanged releases
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  delivery:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: python -m pip install -r skill-library requirements
        run: 'python -m pip install --require-hashes --only-binary :all: -r .github/skills/skill-library/scripts/requirements.txt -r .github/skills/skill-library/scripts/requirements-spec-kit.txt'

      - name: download explicit previous delivery
        if: inputs.previous-delivery-run != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_RUN: ${{ inputs.previous-delivery-run }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PREVIOUS_RUN -cnotmatch '^[1-9][0-9]{0,19}$') { throw 'Use an exact previous run ID.' }
          gh run download $env:PREVIOUS_RUN --repo $env:GITHUB_REPOSITORY --name skill-components --dir "$env:RUNNER_TEMP/previous-skill-delivery"
          if ($LASTEXITCODE -ne 0) { throw 'The requested previous delivery could not be downloaded.' }

      - name: prepare or build component delivery
        shell: pwsh
        env:
          DELIVERY_MODE: ${{ inputs.mode }}
          IMPACT_JSON: ${{ inputs.impact-json }}
          BOOTSTRAP_IDS: ${{ inputs.bootstrap-ids }}
        run: |
          $ErrorActionPreference = 'Stop'
          . "$env:GITHUB_WORKSPACE/.github/skills/skill-library/scripts/Invoke-ComponentDelivery.ps1"
          $Bootstrap = ConvertFrom-Json -InputObject $env:BOOTSTRAP_IDS -NoEnumerate
          if ($Bootstrap -isnot [array] -or @($Bootstrap | Where-Object { $_ -isnot [string] }).Count) { throw 'Bootstrap IDs must be a JSON string array.' }
          if ($env:DELIVERY_MODE -cnotin @('prepare', 'build')) { throw 'Unknown delivery mode.' }
          $Inputs = @{ RepoRoot = $env:GITHUB_WORKSPACE; ImpactJson = $env:IMPACT_JSON; BootstrapId = @($Bootstrap); PythonPath = (Get-Command python -CommandType Application -TotalCount 1).Source }
          $ReportRoot = "$env:RUNNER_TEMP/skill-delivery"
          [void][IO.Directory]::CreateDirectory($ReportRoot)
          $Plan = Invoke-SkillComponentDelivery @Inputs
          [IO.File]::WriteAllText("$ReportRoot/preparation.json", ($Plan | ConvertTo-Json -Depth 100) + "`n")
          if (-not $Plan.Ready) { throw 'Explicit component decisions are incomplete; review preparation.json.' }
          if ($env:DELIVERY_MODE -ceq 'build') {
            $Catalogs = @()
            $Previous = "$env:RUNNER_TEMP/previous-skill-delivery/build/components"
            if (Test-Path -LiteralPath $Previous) {
              foreach ($File in Get-ChildItem -LiteralPath $Previous -Filter catalog.json -Recurse -File) {
                $Catalog = Get-Content -LiteralPath $File.FullName -Raw | ConvertFrom-Json -AsHashtable
                if (-not $Catalog.extensions.Contains('skill')) { $Catalogs += $File.FullName }
              }
            }
            $Built = Invoke-SkillComponentDelivery @Inputs -Build -OutputDirectory "$ReportRoot/build" -LibraryCatalogPath $Catalogs
            if ($Built.Artifacts.Count -eq 0) { throw 'No component artifacts were built.' }
          }

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: skill-components
          path: ${{ runner.temp }}/skill-delivery/
          if-no-files-found: error
          retention-days: 30
