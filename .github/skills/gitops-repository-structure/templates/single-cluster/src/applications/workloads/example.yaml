apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: example
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: example-workloads
  destination:
    server: https://kubernetes.default.svc
    namespace: example
  source:
    repoURL: https://example.com/gitops.git
    targetRevision: main
    path: src/resources/example/manifests
    directory:
      recurse: false
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
