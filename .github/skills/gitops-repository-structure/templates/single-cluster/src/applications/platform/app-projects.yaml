apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-projects
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: example-projects
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  source:
    repoURL: https://example.com/gitops.git
    targetRevision: main
    path: src/resources/app-projects
    directory:
      recurse: false
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
