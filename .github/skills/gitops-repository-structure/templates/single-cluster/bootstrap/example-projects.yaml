apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: example-projects
  namespace: argocd
spec:
  sourceRepos:
    - https://example.com/gitops.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: AppProject
