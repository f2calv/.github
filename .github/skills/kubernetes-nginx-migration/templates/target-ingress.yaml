apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: example-route-f5-preview
  namespace: example
  annotations:
    nginx.org/client-max-body-size: "8m"
    nginx.org/proxy-read-timeout: "45s"
    nginx.org/proxy-send-timeout: "45s"
spec:
  ingressClassName: nginx-f5-example
  tls:
    - hosts:
        - app.example.com
      secretName: example-tls
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: example-api
                port:
                  number: 8080
