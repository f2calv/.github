version: 2
registries:
  example-feed:
    type: nuget-feed
    url: https://packages.example.com/nuget/v3/index.json
    username: ${{secrets.PRIVATE_NUGET_USERNAME}}
    password: ${{secrets.PRIVATE_NUGET_PASSWORD}}
updates:
  - package-ecosystem: nuget
    directory: /
    registries:
      - example-feed
    schedule:
      interval: weekly
