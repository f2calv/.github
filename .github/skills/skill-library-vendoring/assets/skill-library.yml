# Seeded by the skill-library-vendoring skill; this repository owns it after the first sync.
# Adjust runner labels and action availability for your host. On GitHub Enterprise Server, check the
# actions/deploy-pages compatibility table and that Pages is enabled, or publish catalog.json elsewhere
# and point catalogUrl in .github/skill-library.config.yaml at it. Publish-SkillRelease.ps1 needs
# PowerShell 7.4+, Git, gh and Mike Farah yq v4 on the runner.
name: skill-library

'on':
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  skill-library-tests:
    name: skill-library-tests (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        suite: [pester-tests, python-tests, bash-tests]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: docker compose run --rm ${{ matrix.suite }}
        run: docker compose run --rm "$SUITE"
        env:
          SUITE: ${{ matrix.suite }}

  skill-versions:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test-SkillLibrary.ps1
        shell: pwsh
        run: ./.github/skills/skill-library/scripts/Test-SkillLibrary.ps1

  skill-releases:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [skill-library-tests, skill-versions]
    runs-on: ubuntu-26.04
    concurrency:
      group: skill-releases
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      site-directory: ${{ steps.publish.outputs.site-directory }}
    steps:
      #Publish-SkillRelease.ps1 fetches tags, which needs the checkout token in a private repository.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Publish-SkillRelease.ps1
        id: publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/skills/skill-library/scripts/Publish-SkillRelease.ps1

      - uses: actions/upload-pages-artifact@v5
        if: steps.publish.outputs.site-directory != ''
        with:
          path: ${{ steps.publish.outputs.site-directory }}

  skill-catalog:
    if: needs.skill-releases.outputs.site-directory != ''
    needs: [skill-releases]
    runs-on: ubuntu-26.04
    concurrency:
      group: skill-catalog
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deploy
