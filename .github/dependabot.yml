version: 2
updates:

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
      time: "04:00"

  - package-ecosystem: docker
    directory: /.github/skills/pre-commit-management
    schedule:
      interval: weekly
      time: "04:00"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      time: "04:00"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      time: "04:00"

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      time: "04:00"

  #The runnable parsing fixture is maintained and built by CI; illustrative package fragments are not.
  - package-ecosystem: nuget
    directory: /.github/skills/dotnet-performance/examples/utf8-count
    schedule:
      interval: weekly
      time: "04:00"
