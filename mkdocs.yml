site_name: Agent Customization Library
site_description: Reusable instructions, skills and supporting guides.
site_url: https://f2calv.github.io/.github/docs/
repo_url: https://github.com/f2calv/.github
edit_uri: blob/main/
docs_dir: .docs-source
site_dir: .docs-site
use_directory_urls: true

theme:
  name: mkdocs
  color_mode: auto
  user_color_mode_toggle: true
  navigation_depth: 2

plugins:
  - search

markdown_extensions:
  - admonition
  - fenced_code
  - tables
  - toc:
      permalink: true

extra_javascript:
  - docs/assets/mermaid.mjs

hooks:
  - .scripts/mkdocs_hooks.py

exclude_docs: |
  !.github

not_in_nav: |
  .github/
  docs/

validation:
  links:
    anchors: warn
    unrecognized_links: warn

nav:
  - Home: README.md
  - Skills: docs/skills.md
  - Distribution: docs/adr-0001-skill-library-distribution.md
  - Contributing: CONTRIBUTING.md
